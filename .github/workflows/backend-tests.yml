name: Backend tests

# No path filter on purpose: this check is meant to be a required status check, and a
# filtered check that never runs leaves the PR waiting on it forever instead of passing.
on:
  # gates the merge
  pull_request:
    branches: [main]
  # verifies the squashed commit that actually lands: a squash merge creates a new SHA
  # the pull_request run never saw, so without this main carries no check at all
  push:
    branches: [main]

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
